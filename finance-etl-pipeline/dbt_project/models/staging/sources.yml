version: 2

sources:
  - name: raw
    description: "Datos crudos cargados directamente por el pipeline de Python (extract + load)"
    schema: raw
    tables:
      - name: stock_prices
        description: "Precios históricos de acciones, extraídos de Yahoo Finance vía yfinance"
        columns:
          - name: id
            description: "Identificador autoincremental de la fila"
            tests:
              - unique
              - not_null
          - name: ticker
            description: "Símbolo bursátil, ej. AAPL, MSFT"
            tests:
              - not_null
          - name: date
            description: "Fecha del precio registrado"
            tests:
              - not_null
          - name: open
            description: "Precio de apertura"
          - name: high
            description: "Precio máximo del día"
          - name: low
            description: "Precio mínimo del día"
          - name: close
            description: "Precio de cierre"
            tests:
              - not_null
          - name: volume
            description: "Volumen de acciones negociadas"
          - name: extracted_at
            description: "Timestamp de cuándo se extrajo este dato"